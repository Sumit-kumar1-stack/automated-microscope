name: Engineering CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: engineering-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and Scan Regression

    runs-on: ubuntu-latest

    timeout-minutes: 15

    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Show runtime versions
        run: |
          node --version
          npm --version

      - name: TypeScript and scan regression
        run: npm run verify


  lint:
    name: ESLint

    runs-on: ubuntu-latest

    timeout-minutes: 10

    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint


  build:
    name: Production Build

    runs-on: ubuntu-latest

    timeout-minutes: 20

    env:
      NEXT_TELEMETRY_DISABLED: "1"

      # Build-time service address only.
      # CI does not perform real model inference.
      ML_INFERENCE_URL: "http://127.0.0.1:8000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production application
        run: npm run build